---
meta:
  author: "Jesse Hitch"
  description: "Zitadel Rule Exclusions Plugin admin check language endpoints"
rule_id: 9535009
tests:
  - test_id: 1
    desc: Check if an admin user can check their language settings
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/grpc-web+proto
          port: 80
          method: POST
          uri: /zitadel.admin.v1.AdminService/GetAllowedLanguages
          data: |
            text
        output:
          log:
            no_expect_ids: [920420]
  - test_id: 2
    desc: Check if an admin user can check their language settings, part 2
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/grpc-web+proto
          port: 80
          method: POST
          uri: /zitadel.admin.v1.AdminService/GetSupportedLanguages
          data: |
            text
        output:
          log:
            no_expect_ids: [920420]
