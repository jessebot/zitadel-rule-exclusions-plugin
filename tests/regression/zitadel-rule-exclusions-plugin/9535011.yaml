---
meta:
  author: "Jesse Hitch"
  description: "Zitadel Rule Exclusions Plugin admin update custom script action endpoint"
rule_id: 9535011
tests:
  - test_id: 1
    desc: Check if an admin user can upload a custom action script. This is needed for Zitadel "group checking".
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
          port: 80
          method: POST
          uri: /management/v1/actions
          data: |-
              {"script": ("function groupsclaim(ctx api) { if(ctx.v1.user.grants === undefined || ctx.v1.user.grants.count == 0) { return } let grants = [] ctx.v1.user.grants.grants.foreach(claim => { claim.roles.foreach(role => { grants.push(role) }) }) api.v1.claims.setclaim(groups grants)}"}
        output:
          log:
            no_expect_ids: [932140]
