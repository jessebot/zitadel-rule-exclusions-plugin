---
meta:
  author: "Jesse Hitch"
  description: "Zitadel Rule Exclusions Plugin for logins (with alt password functionality)"
rule_id: 9535012
tests:
  - test_id: 1
    desc: Check if a user can auth to the passkey endpoint
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: text/plain
          port: 80
          method: POST
          uri: /ui/v2/login/password?loginName=someuser&altPassword=true&organization=000000000000000000&requestId=oidc_V2_000000000000000000
          data: |
            [{"loginName":"someuser","sessionId":"$undefined","organization":"000000000000000000","challenges":{"$typeName":"zitadel.session.v2.RequestChallenges","webAuthN":{"$typeName":"zitadel.session.v2.RequestChallenges.WebAuthN","domain":"","userVerificationRequirement":1}},"requestId":"oidc_V2_000000000000000000"}]
        output:
          log:
            no_expect_ids:
              - 920420
              - 942290
