---
meta:
  author: "Jesse Hitch"
  description: "Zitadel Rule Exclusions Plugin admin update custom script action endpoint"
rule_id: 9535012
tests:
  - test_id: 1
    desc: Check if an admin user can upload a custom action script. This is needed for Zitadel "group checking".
    stages:
      - input:
          dest_addr: 127.0.0.1
          headers:
            Host: localhost
            User-Agent: OWASP CRS
            Accept: text/xml,application/xml,application/xhtml+xml,text/html;q=0.9,text/plain;q=0.8,image/png,*/*;q=0.5
            Content-Type: application/json
          port: 80
          method: POST
          uri: /management/v1/users/human/_import
          data: |-
            {"userName": username, "profile": { "nickName": "friend", "preferredLanguage": "en" }, "email": { "email": email, "isEmailVerified": True }, "password": password, "passwordChangeRequired": True, }
        output:
          log:
            no_expect_ids: [930120]
