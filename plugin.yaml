# OWASP CRS Plugin Descriptor
# See https://github.com/coreruleset/plugin-registry for the schema definition.

schema_version: 1

plugin:
  name: "zitadel-rule-exclusions-plugin"
  description: "Rule exclusions plugin for zitadel."
  long_description: |
    Provides targeted rule exclusions to eliminate false positive when running
    OWASP CRS in front of Zitadel, a self-hosted Identity and auth provider
    specializing in Oauth2 and OIDC.
  type: "3rd-party"
  category: "rule-exclusion"
  status: "tested"
  license: "Apache-2.0"
  authors:
    - name: "OWASP CRS Team"
      url: "https://coreruleset.org"
    - name: "JesseBot"
      url: "https://jessebot.work"
  repository: "https://git.open.engineering/oeng/zitadel-rule-exclusions-plugin"
  keywords:
    - "rule-exclusions"
    - "zitadel"
    - "oidc"
    - "oauth2"
    - "false-positive"

rule_id_range:
  start: 9535000
  end: 9535999

compatibility:
  crs_version: ">=4.0.0"
  # engines is spelled out here, even though the zitadel-rule-exclusions supports all three,
  # to showcase the field for authors copying this file. A real plugin that
  # truly supports every engine should omit `engines` instead: per
  # docs/plugin-descriptor-schema.md, an omitted field already means "all".
  engines:
    - "modsecurity3"
    - "coraza"

configuration:
  file: "plugins/zitadel-rule-exclusions-config.conf"
  variables:
    - name: "tx.zitadel-rule-exclusions-plugin_enabled"
      type: "boolean"
      default: 1
      description: "Enables or disables the zitadel-rule-exclusions plugin (0 to disable)."
      required: false
