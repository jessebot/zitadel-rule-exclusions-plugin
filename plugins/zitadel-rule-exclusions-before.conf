# OWASP CRS Plugin
# Plugin name: zitadel-rule-exclusions-plugin
# Plugin description: Plugin to do rule exclusion of legit zitadel traffic
# Rule ID block base: 9,535,000 (range is 1000, thus ID block base +1000)
# Plugin version: 1.0.0

# Generic rule to disable plugin
SecRule TX:zitadel-rule-exclusions-plugin_enabled "@eq 0" "id:9535099,phase:1,pass,nolog,ctl:ruleRemoveById=9535000-9535999"

# rule 9,535,100 : Detect ARGS zitadel-rule-exclusions-plugin-test-parameter and trigger alert if hit
SecRule ARGS:zitadel-rule-exclusions-plugin-test-parameter "@rx ." \
	"id:9535100,\
	phase:2,\
	block,\
	t:none,\
	msg:'Detected presence of parameter zitadel-rule-exclusions-plugin-test-parameter',\
	logdata:'%{MATCHED_VAR_NAME}: %{MATCHED_VAR}',\
	tag:'application-multi',\
	tag:'language-multi',\
	tag:'platform-multi',\
	tag:'attack-protocol',\
	tag:'paranoia-level/1',\
	tag:'OWASP_CRS',\
	tag:'capec/FIXME',\
	tag:'zitadel-rule-exclusions-plugin',\
        ver:'zitadel-rule-exclusions-plugin/1.0.0',\
	severity:'CRITICAL',\
	setvar:'tx.anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# [ Local CRS initialization ]
#
# We need to initialize some of the CRS variables also here because plugin setup runs before
# CRS initialization (this is a known limitation of the current plugin architecture). Must be
# kept in sync with CRS default setting.

# Copy of CRS rule 901160.
SecRule &TX:allowed_methods "@eq 0" \
    "id:9535101,\
    phase:1,\
    pass,\
    nolog,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_methods=GET HEAD POST OPTIONS'"


# Copy of CRS rule 901162.
SecRule &TX:allowed_request_content_type "@eq 0" \
    "id:9535102,\
    phase:1,\
    pass,\
    nolog,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |text/xml| |application/xml| |application/soap+xml| |application/json|'"

# -------------------------------------------------------------------------
# For logging in with OIDC. Example requests:
#
# - /ui/v2/login/loginname?requestId=oidc_V2_000000000000000000
# - /ui/v2/login/accounts?requestId=oidc_V2_000000000000000000
# - /ui/v2/login/accounts?organization=000000000000000000&requestId=oidc_V2_000000000000000000&loginName=exampleuser
# Rule Match: 920420
# Message:    Request content type is not allowed by policy
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx /ui/v2/login/(?:loginname|accounts|password|u2f|passkey)\?.*" \
    "id:9535003,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:requestBodyProcessor=JSON,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |text/plain|'"

# -------------------------------------------------------------------------
# For logging in with OIDC either with password or universal 2 factor e.g. yubikey.
#
# Example request URIs:
#
# - /ui/v2/login/password?loginName=someuser&requestId=oidc_V2_000000000000000000&organization=000000000000000000
# - /ui/v2/login/u2f?loginName=someuser&requestId=oidc_V2_000000000000000000&organization=000000000000000000
# - /ui/v2/login/password?loginName=someuser&organization=000000000000000000&requestId=oidc_V2_000000000000000000
#
# also avoid 942290 because it thinks the normla json.0.checks.password.$typename
# is a MongoDB attack, but Zitadel doesn't use MongoDB
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx /ui/v2/login/password\?.+$" \
    "id:9535004,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=942290;ARGS_NAMES:json.0.checks.$typeName,\
        ctl:ruleRemoveTargetById=942290;ARGS_NAMES:json.0.checks.password.$typeName"

# -------------------------------------------------------------------------
# When a user views the console after a login
# Applies to the following URIs:
#
# # Auth and initial perms check:
# - /zitadel.auth.v1.AuthService/ListMyProjectOrgs
# - /zitadel.auth.v1.AuthService/GetMyUser
# - /zitadel.auth.v1.AuthService/ListMyZitadelPermissions
# - /zitadel.auth.v1.AuthService/ListMyMetadata
#
# # Get User info:
# - /zitadel.user.v2.UserService/GetUserByID
#
# Get Features of the Zitadel that a uer can access:
# - /zitadel.feature.v2.FeatureService/GetInstanceFeatures
#
# Get and Delete Sessions (specifically for checking session and logging out):
# - /zitadel.session.v2.SessionService/ListSessions
# - /zitadel.session.v2.SessionService/ListSessions
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /zitadel.auth.v1.AuthService/" \
    "id:9535005,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/grpc-web+proto|'"

SecRule REQUEST_URI "@beginsWith /zitadel.user.v2.UserService/" \
    "id:9535006,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/grpc-web+proto|'"

SecRule REQUEST_URI "@beginsWith /zitadel.feature.v2.FeatureService/" \
    "id:9535007,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/grpc-web+proto|'"

# Sessions (specifically for logging out):
# - /zitadel.session.v2.SessionService/ListSessions
SecRule REQUEST_URI "@beginsWith /zitadel.session.v2.SessionService/" \
    "id:9535008,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/grpc-web+proto|'"

# -------------------------------------------------------------------------
# specifically for if the user is an Admin and viewing the console after a login
#
# - /zitadel.admin.v1.AdminService/GetAllowedLanguages
# - /zitadel.admin.v1.AdminService/GetSupportedLanguages
#
# - /zitadel.management.v1.ManagementService/ListGrantedProjects
# - /zitadel.management.v1.ManagementService/GetLoginPolicy
# - /zitadel.management.v1.ManagementService/ListProjects
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /zitadel.admin.v1.AdminService/" \
    "id:9535009,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/grpc-web+proto|'"

SecRule REQUEST_URI "@beginsWith /zitadel.management.v1.ManagementService/" \
    "id:9535010,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |application/grpc-web+proto|'"

# -------------------------------------------------------------------------
#
# allow a user to login with a two factor webAuthN (universal or password) or totp
# - /ui/v2/login/passkey?loginName=exampleuser&altPassword=true&requestId=oidc_V2_000000000000000000&organization=000000000000000000
#
# will hit content type issue, but also this 942290:
#   Target Path   │ /ui/v2/login/passkey?loginName=exampleuser&altPassword=true&requestId=oidc_V2_000000000000000000&organization=000000000000000000
#   Message       │ Finds basic MongoDB SQL injection attempts
#   Matched Zones │ ARGS_NAMES.json.0.challenges.$typeName,ARGS_NAMES.json.0.challenges.webAuthN.$typeName
#   Matched Data  │ Matched Data: $type found within ARGS_NAMES:json.0.challenges.$typeName: json.0.challenges.$typeName
#
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx /ui/v2/login/(?:u2f|passkey|otp)\?.*" \
    "id:9535012,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        setvar:'tx.allowed_request_content_type=%{tx.allowed_request_content_type} |text/plain|',\
        ctl:ruleRemoveTargetById=942290;ARGS_NAMES:json.0.challenges.$typeName"

# -------------------------------------------------------------------------
#
# allow a user to login via a one time password
# - e.g. /ui/v2/login/otp/time-based?loginName=exampleuser&requestId=oidc_V2_000000000000000000&organization=000000000000000000
#
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@beginsWith /ui/v2/login/otp/time-based" \
    "id:9535013,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=942290;ARGS_NAMES:json.0.checks.totp.$typeName"

# -------------------------------------------------------------------------
# allow a user to login via a passkey or universal 2 factor
#
#  Target Path   │ /ui/v2/login/u2f?loginName=exampleuser&requestId=oidc_V2_000000000000000000&organization=000000000000000000
#  Matched Zones │ ARGS_NAMES.json.0.challenges.$typeName,ARGS_NAMES.json.0.challenges.webAuthN.$typeName
#  Matched Data  │ Matched Data: $type found within ARGS_NAMES:json.0.challenges.$typeName
#                │ json.0.challenges.$typeName
# -------------------------------------------------------------------------
SecRule REQUEST_URI "@rx /ui/v2/login/(?:u2f|passkey)\?.*" \
    "id:9535014,\
    phase:1,\
    ver:'zitadel-rule-exclusions-plugin/1.0.0',\
    pass,\
    t:none,\
    nolog,\
    chain"
    SecRule REQUEST_METHOD "@streq POST" \
        "t:none,\
        ctl:ruleRemoveTargetById=942290;ARGS_NAMES:json.0.challenges.webAuthN.$typeName"

# This is left over from an earlier version of zitadel and I'm not sure if it still applies
# zitadel sends a __Host-zitadel.useragent cookie that sometimes has a = in it
